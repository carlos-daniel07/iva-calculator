<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de IVA</title>
    <link rel="shortcut icon" href="./favicon-iva-calculator.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Calculadora de IVA</h1>
    <form>
      <label for="precio">Precio sin IVA:</label>
      <input type="number" id="precio" value="0" />
      <label for="iva">Tasa de IVA (%):</label>
      <input type="number" id="iva" value="0" />

      <div class="resultados">
        <p id="iva-amount"></p>
        <p id="total"></p>
      </div>
    </form>

    <script src="./script.js"></script>
  </body>
</html>
